{% extends "base.html" %}
{% block content %}
<h2>Edit Person</h2>

<form method="GET" class="mt-3 mb-4">
    <div class="mb-3">
        <label class="form-label">Person</label>
        <select name="person_id" class="form-control" required>
            <option value="">Choose a person</option>
            {% for person in people %}
            <option value="{{ person.id }}" {% if selected_person and selected_person.id == person.id %}selected{% endif %}>
                {{ person.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-secondary">Edit</button>
</form>

{% if selected_person %}
<form method="POST" class="mt-3">
    <input type="hidden" name="person_id" value="{{ selected_person.id }}">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ selected_person.name }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control" required>
    </div>

    <button class="btn btn-primary">Save Changes</button>
</form>
{% endif %}
{% endblock %}
